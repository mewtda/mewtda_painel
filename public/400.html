<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Requisição inválida · MeuCRM</title>
  <link rel="icon" href="/favicon-96x96.png" type="image/png">
  <style>
    :root { --primary: #5800e8; --primary-hover: #4700bd; --bg: #f6f5fa; --card: #ffffff; --fg: #0d1321;
            --fg-alt: #6f7482; --outline: #ececef; --tint: rgba(88, 0, 232, .08); }
    @media (prefers-color-scheme: dark) {
      :root { --primary: #a27bff; --primary-hover: #b896ff; --bg: #0f0e17; --card: #17161f; --fg: #f5f3ff;
              --fg-alt: #a3a1b3; --outline: #2a2933; --tint: rgba(162, 123, 255, .14); }
    }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center;
           justify-content: center; padding: 24px; background: var(--bg); color: var(--fg);
           font-family: 'Google Sans Flex', 'Roboto', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif; }
    .card { width: 100%; max-width: 480px; padding: 40px 32px 32px; border: 1px solid var(--outline);
            border-radius: 16px; background: var(--card); text-align: center;
            box-shadow: 0 12px 40px rgba(13, 19, 33, .08); }
    .logo { display: block; height: 34px; width: auto; margin: 0 auto 32px; }
    .code { display: inline-block; margin-bottom: 16px; padding: 6px 14px; border-radius: 999px;
            background: var(--tint); color: var(--primary); font-size: 13px; font-weight: 700; letter-spacing: .06em; }
    h1 { margin: 0 0 12px; font-size: 24px; line-height: 1.25; letter-spacing: -.01em; }
    p { margin: 0 0 28px; font-size: 15px; line-height: 1.6; color: var(--fg-alt); }
    .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
    .btn { display: inline-flex; align-items: center; justify-content: center; min-height: 42px; padding: 0 20px;
           border-radius: 10px; border: 1px solid var(--outline); background: transparent; color: var(--fg);
           font: inherit; font-size: 14px; font-weight: 600; text-decoration: none; cursor: pointer; }
    .btn:hover { border-color: var(--primary); color: var(--primary); }
    .btn--primary { background: var(--primary); border-color: var(--primary); color: #fff; }
    .btn--primary:hover { background: var(--primary-hover); border-color: var(--primary-hover); color: #fff; }
    .foot { margin-top: 20px; font-size: 12px; color: var(--fg-alt); }
  </style>
</head>
<body>
  <main class="card">
    <picture>
      <source srcset="/error-logo-dark.png" media="(prefers-color-scheme: dark)">
      <img class="logo" src="/error-logo.png" alt="MeuCRM">
    </picture>
    <span class="code">ERRO 400</span>
    <h1>Requisição inválida</h1>
    <p>Não conseguimos entender o pedido enviado. Volte e tente de novo.</p>
    <div class="actions">
      <a class="btn btn--primary" href="/crm">Ir para o painel</a>
      <button class="btn" type="button" onclick="history.length > 1 ? history.back() : location.assign('/crm')">Voltar</button>
    </div>
  </main>
  <div class="foot">Se o problema continuar, fale com o suporte.</div>
</body>
</html>
